version: 2

updates:
  - package-ecosystem: npm
    directory: /pay-guard-backend
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 10
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(npm)

  - package-ecosystem: docker
    directory: /pay-guard-backend
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(actions)
